apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-ai
  namespace: default
  labels:
    app: alert-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alert-ai
  template:
    metadata:
      labels:
        app: alert-ai
    spec:
      containers:
        - name: alert-ai
          image: alert-ai:1.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: alert-ai-config
            - secretRef:
                name: alert-ai-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
