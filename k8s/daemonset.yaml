apiVersion: apps/v1
kind: DaemonSet
metadata: 
  name: system-monitor
  namespace: monitor
spec:
  selector:
    matchLabels:
      app: system-monitor
  template:
    metadata:
      labels:
        app: system-monitor
    spec:
      hostAliases:
      - ip: "101.91.40.24"
        hostnames:
        - "qyapi.weixin.qq.com"
      - ip: "43.242.198.77"   # 替换为实际可达 IP
        hostnames:
        - "api.deepseek.com"
      hostPID: true
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: monitor
        image: crpi-l986bg1ovxy9r4lx.cn-hongkong.personal.cr.aliyuncs.com/nginx_laoli/monitor:v5
        envFrom:
        - configMapRef:
            name: monitor-config
        - secretRef:
            name: monitor-secret 
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: PYTHONUNBUFFERED       # ← 新增
          value: "1"
        ports:
        - containerPort: 8000
          name: metrics
        - containerPort: 8001
          name: health
        volumeMounts:
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-root
          mountPath: /host
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            cpu: 100m
            memory: 200Mi
      volumes:
      - name: host-proc
        hostPath:
          path: /proc
      - name: host-root
        hostPath:
          path: /    

